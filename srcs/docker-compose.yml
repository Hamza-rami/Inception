services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    restart: on-failure
    env_file:
      - ./.env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    restart: on-failure
    env_file:
      - ./.env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    restart: on-failure
    env_file:
      - ./.env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    ports:
      - "443:443"
    depends_on:
      - wordpress

  redis:
    container_name: redis
    build: ./requirements/bonus/redis
    restart: on-failure
    networks:
      - inception

  ftp:
    container_name: ftp
    build: ./requirements/bonus/ftp
    restart: on-failure
    env_file:
      - ./.env
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    networks:
      - inception

  adminer:
    container_name: adminer
    build: ./requirements/bonus/adminer
    restart: on-failure
    networks:
      - inception

  static:
    container_name: static
    build: ./requirements/bonus/static
    restart: on-failure
    networks:
      - inception

  netdata:
    container_name: netdata
    build: ./requirements/bonus/netdata
    restart: on-failure
    networks:
      - inception
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

    

networks:
  inception:
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hrami/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hrami/data/wordpress
